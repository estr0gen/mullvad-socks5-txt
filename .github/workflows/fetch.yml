name: Update Mullvad SOCKS Proxies

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-mullvad-proxies:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch and process Mullvad relays
        run: |
          # Fetch the relay data
          curl -s https://api.mullvad.net/www/relays/all/ -o relays.json
          
          # Process the JSON and extract SOCKS proxies
          jq -r '.[] | select(.socks_name != null) | "socks5://\(.socks_name):\(.socks_port)"' relays.json | sort > mullvad.txt
          
          # Create no_prefix version
          jq -r '.[] | select(.socks_name != null) | "\(.socks_name):\(.socks_port)"' relays.json | sort > mullvad_no_prefix.txt
          
          # Create countries directory
          mkdir -p countries
          
          # Get unique country codes
          jq -r '.[] | select(.socks_name != null) | .country_code' relays.json | sort -u > country_codes.txt
          
          # Process each country
          while read -r country_code; do
            jq -r --arg code "$country_code" '.[] | select(.socks_name != null and .country_code == $code) | "socks5://\(.socks_name):\(.socks_port)"' relays.json | sort > "countries/${country_code}.txt"
            jq -r --arg code "$country_code" '.[] | select(.socks_name != null and .country_code == $code) | "\(.socks_name):\(.socks_port)"' relays.json | sort > "countries/${country_code}_no_prefix.txt"
            echo "Created countries/${country_code}.txt with $(wc -l < "countries/${country_code}.txt") proxies"
          done < country_codes.txt
          
          # Clean up temporary files
          rm relays.json country_codes.txt
          
          # Show summary
          echo "Found $(wc -l < mullvad.txt) total SOCKS proxies"
          echo "Created $(ls -1 countries/*.txt 2>/dev/null | wc -l) country files"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mullvad.txt mullvad_no_prefix.txt countries/
          git commit -m "Update Mullvad SOCKS proxies - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push